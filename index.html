<!DOCTYPE html>
<html>
<head>
    <title>Driver Update Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Check for Graphics Driver Updates</h1>
        <button id="checkUpdate">Check Update</button>
        <div class="version-info">
            <p id="currentVersion" style="display: none;">Current Version: 420.20</p>
            <p id="latestVersion" style="display: none;">Latest Version: 569.69</p>
        </div>
        <button id="downloadButton" style="display: none;">Download Latest Driver</button>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
